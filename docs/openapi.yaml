openapi: 3.0.3
info:
  title: Infocom Implementation Dashboard API
  version: 1.0.0
  description: API for implementation project tracking and task management.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/projects:
    get:
      summary: List projects and calculated statuses
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tasks:
    get:
      summary: List tasks
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/projects/{id}/status:
    get:
      summary: Calculate project status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Calculated project status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [green, yellow, red]
      required: [id, name, status]
    TaskInput:
      type: object
      required: [project_id, title, deadline]
      properties:
        project_id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
        assignee:
          type: string
          maxLength: 255
          nullable: true
        deadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [todo, in_progress, done, blocker]
          default: todo
    Task:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        assignee:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, done, blocker]
      required: [id, project_id, title, status]
    ProjectStatus:
      type: object
      properties:
        project_id:
          type: integer
        calculated_status:
          type: string
          enum: [green, yellow, red]
        reason:
          type: string
      required: [project_id, calculated_status, reason]
