name: CI Pipeline

on:
  push:
    branches: [develop, main]

  pull_request:
    branches: [develop, main]

jobs:
  backend-build:
    name: Backend Build and Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            curl \
            libpqxx-dev \
            libpq-dev \
            cppcheck

      - name: Download httplib
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/yhirose/cpp-httplib/master/httplib.h \
            -o /tmp/httplib.h

      - name: Compile backend
        run: |
          g++ -std=c++17 -O2 \
            -I/tmp \
            -Ibackend/include \
            backend/app/main.cpp \
            -o /tmp/backend-server \
            -lpqxx -lpq -pthread

      - name: Run Cppcheck
        run: |
          cppcheck \
            --enable=warning,style \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            backend/app/main.cpp

      - name: Check required files
        run: |
          test -f backend/app/main.cpp
          test -f backend/include/json.hpp
          test -f backend/Dockerfile
          test -f backend/migrations/001_init.sql
          test -f docker-compose.yml
          test -f docs/openapi.yaml

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

  frontend-check:
    name: Frontend Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/Dockerfile
